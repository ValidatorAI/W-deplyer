---
- name: Install Hermes
  hosts: w_servers
  become: true
  vars:
    hermes_user: "{{ ansible_user | default('root') }}"
    hermes_home: "{{ ansible_env.HOME | default('/root') }}"
    hermes_data_dir: "{{ hermes_home }}/.hermes"
    hermes_network_name: w-network
    hermes_openviking_enabled: true
    hermes_openviking_base_url: "http://openviking:8080"
    hermes_openviking_api_key: ""

  tasks:
    - name: Ensure Docker is installed
      ansible.builtin.command: docker --version
      register: docker_version
      changed_when: false

    - name: Ensure Hermes API server key is provided via vars
      ansible.builtin.assert:
        that:
          - hermes_api_server_key is defined
          - hermes_api_server_key | length > 0
        fail_msg: "Provide hermes_api_server_key via vars/inventory/extra-vars."

    - name: Ensure Hermes data directory exists
      ansible.builtin.file:
        path: "{{ hermes_data_dir }}"
        state: directory
        mode: "0700"
        owner: "{{ hermes_user }}"
        group: "{{ hermes_user }}"

    - name: Check Hermes Docker network exists
      community.docker.docker_network_info:
        name: "{{ hermes_network_name }}"
      register: hermes_network_info

    - name: Fail if Hermes network is missing
      ansible.builtin.assert:
        that:
          - hermes_network_info.exists
        fail_msg: "Docker network '{{ hermes_network_name }}' not found. Create it first (for example via install_docker.yml)."

    - name: Remove existing Hermes container if present
      ansible.builtin.command: docker rm -f hermes
      register: hermes_rm
      changed_when: hermes_rm.rc == 0
      failed_when: hermes_rm.rc != 0 and 'No such container' not in hermes_rm.stderr

    - name: Run Hermes container
      ansible.builtin.command:
        argv:
          - docker
          - run
          - -d
          - --name
          - hermes
          - --restart
          - unless-stopped
          - --network
          - "{{ hermes_network_name }}"
          - -v
          - "{{ hermes_data_dir }}:/opt/data"
          - -p
          - 8642:8642
          - -e
          - API_SERVER_ENABLED=true
          - -e
          - API_SERVER_HOST=0.0.0.0
          - -e
          - "API_SERVER_KEY={{ hermes_api_server_key }}"
          - -e
          - API_SERVER_CORS_ORIGINS=*
          - -e
          - "OPENVIKING_ENABLED={{ hermes_openviking_enabled | ternary('true', 'false') }}"
          - -e
          - "OPENVIKING_BASE_URL={{ hermes_openviking_base_url }}"
          - -e
          - "OPENVIKING_API_KEY={{ hermes_openviking_api_key }}"
          - nousresearch/hermes-agent
          - gateway
          - run
      register: hermes_container_run
      changed_when: true
      no_log: true

    - name: Enable Hermes Kanban dashboard plugin by default
      ansible.builtin.command:
        argv:
          - docker
          - exec
          - hermes
          - hermes
          - plugins
          - enable
          - kanban/dashboard
      register: hermes_kanban_plugin_enable
      changed_when: "'already enabled' not in (hermes_kanban_plugin_enable.stdout | lower)"

    - name: Set Hermes OpenViking target URI template
      ansible.builtin.command:
        argv:
          - docker
          - exec
          - hermes
          - hermes
          - config
          - set
          - memory.openviking.targetUri
          - viking://{user}
      register: hermes_openviking_target_uri_set
      changed_when: true

    - name: Append Bonfire collaboration rules to Hermes default profile
      ansible.builtin.shell: |
        set -euo pipefail

        rules=$(cat <<'EOF'
        ## Bonfire Collaboration Rules

        ### Response routing
        - If a message is sent from a specific room, send the response to that same room, and use the same sender bot that received the message.

        ### Formatting
        - Do not use markup (Markdown) in responses. Use HTML tags instead: <ul>, <li>, <a>, <b>, <pre>.
        - Always wrap code in <pre> tags.

        ### Kanban
        - Use one kanban board per room. If the room has no board yet, create one. The board is the collaboration surface for the room.
        - When the user approves a task or sets a task as valid, add that task to the shared kanban of the room.

        ### Memory scoping
        - Shared memory is scoped per room: profiles working in the same room share memory with each other; never share memory between two different rooms.
        - A tasks room shares the memory of its parent project room.
        - Two tasks rooms never share memory with each other, even when they belong to the same parent project.
        EOF
        )

        current="$(docker exec hermes hermes config get profiles.default.systemPrompt 2>/dev/null || true)"

        if [[ "$current" == *"## Bonfire Collaboration Rules"* ]]; then
          echo "UNCHANGED"
          exit 0
        fi

        if [[ -n "$current" ]]; then
          updated="${current}"
          updated+=$'\n\n'
          updated+="${rules}"
        else
          updated="${rules}"
        fi

        docker exec hermes hermes config set profiles.default.systemPrompt "$updated" >/dev/null
        echo "CHANGED"
      args:
        executable: /bin/bash
      register: hermes_default_profile_rules_append
      changed_when: "'CHANGED' in hermes_default_profile_rules_append.stdout"

    - name: Show Hermes container id
      ansible.builtin.debug:
        var: hermes_container_run.stdout
