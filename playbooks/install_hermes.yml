---
- name: Install Hermes
  hosts: w_servers
  become: true
  vars:
    hermes_user: "{{ ansible_user | default('root') }}"
    hermes_home: "{{ ansible_env.HOME | default('/root') }}"
    hermes_data_dir: "{{ hermes_home }}/.hermes"
    hermes_network_name: w-network
    hermes_openviking_enabled: true
    hermes_openviking_base_url: "http://openviking:8080"
    hermes_openviking_api_key: ""

  tasks:
    - name: Ensure Docker is installed
      ansible.builtin.command: docker --version
      register: docker_version
      changed_when: false

    - name: Ensure Hermes API server key is provided via vars
      ansible.builtin.assert:
        that:
          - hermes_api_server_key is defined
          - hermes_api_server_key | length > 0
        fail_msg: "Provide hermes_api_server_key via vars/inventory/extra-vars."

    - name: Ensure Hermes data directory exists
      ansible.builtin.file:
        path: "{{ hermes_data_dir }}"
        state: directory
        mode: "0700"
        owner: "{{ hermes_user }}"
        group: "{{ hermes_user }}"

    - name: Check Hermes Docker network exists
      community.docker.docker_network_info:
        name: "{{ hermes_network_name }}"
      register: hermes_network_info

    - name: Fail if Hermes network is missing
      ansible.builtin.assert:
        that:
          - hermes_network_info.exists
        fail_msg: "Docker network '{{ hermes_network_name }}' not found. Create it first (for example via install_docker.yml)."

    - name: Remove existing Hermes container if present
      ansible.builtin.command: docker rm -f hermes
      register: hermes_rm
      changed_when: hermes_rm.rc == 0
      failed_when: hermes_rm.rc != 0 and 'No such container' not in hermes_rm.stderr

    - name: Run Hermes container
      ansible.builtin.command:
        argv:
          - docker
          - run
          - -d
          - --name
          - hermes
          - --restart
          - unless-stopped
          - --network
          - "{{ hermes_network_name }}"
          - -v
          - "{{ hermes_data_dir }}:/opt/data"
          - -p
          - 8642:8642
          - -e
          - API_SERVER_ENABLED=true
          - -e
          - API_SERVER_HOST=0.0.0.0
          - -e
          - "API_SERVER_KEY={{ hermes_api_server_key }}"
          - -e
          - API_SERVER_CORS_ORIGINS=*
          - -e
          - "OPENVIKING_ENABLED={{ hermes_openviking_enabled | ternary('true', 'false') }}"
          - -e
          - "OPENVIKING_BASE_URL={{ hermes_openviking_base_url }}"
          - -e
          - "OPENVIKING_API_KEY={{ hermes_openviking_api_key }}"
          - nousresearch/hermes-agent
          - gateway
          - run
      register: hermes_container_run
      changed_when: true
      no_log: true

    - name: Enable Hermes Kanban dashboard plugin by default
      ansible.builtin.command:
        argv:
          - docker
          - exec
          - hermes
          - hermes
          - plugins
          - enable
          - kanban/dashboard
      register: hermes_kanban_plugin_enable
      changed_when: "'already enabled' not in (hermes_kanban_plugin_enable.stdout | lower)"

    - name: Set Hermes OpenViking target URI template
      ansible.builtin.command:
        argv:
          - docker
          - exec
          - hermes
          - hermes
          - config
          - set
          - memory.openviking.targetUri
          - viking://{user}
      register: hermes_openviking_target_uri_set
      changed_when: true

    - name: Show Hermes container id
      ansible.builtin.debug:
        var: hermes_container_run.stdout
