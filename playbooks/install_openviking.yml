---
- name: Install OpenViking
  hosts: w_servers
  become: true
  vars:
    openviking_user: "{{ ansible_user | default('root') }}"
    openviking_home: "{{ ansible_env.HOME | default('/root') }}"
    openviking_dir: "{{ openviking_home }}/.openviking"
    openviking_venv_dir: "{{ openviking_dir }}/venv"
    openviking_pip_package: "openviking"
    openviking_embedding_provider: "volcengine"
    openviking_embedding_api_key: ""
    openviking_embedding_api_base: "https://ark.cn-beijing.volces.com/api/v3"
    openviking_embedding_model: "doubao-embedding-vision-251215"
    openviking_embedding_dimension: 1024
    openviking_embedding_input: "multimodal"
    openviking_vlm_provider: "volcengine"
    openviking_vlm_api_key: ""
    openviking_vlm_api_base: "https://ark.cn-beijing.volces.com/api/v3"
    openviking_vlm_model: "doubao-seed-2-0-lite-260428"
    openviking_storage_workspace: "./data"
    openviking_server_host: "127.0.0.1"
    openviking_server_port: 1933
    openviking_server_auth_mode: "api_key"
    openviking_server_root_api_key: ""
    openviking_service_name: "openviking"
    openviking_server_cors_origins:
      - "*"

  tasks:
    - name: Ensure python3 is installed
      ansible.builtin.command: python3 --version
      changed_when: false

    - name: Ensure python3-pip is installed
      ansible.builtin.apt:
        name: python3-pip
        state: present
        update_cache: true

    - name: Ensure python3 venv module is available
      ansible.builtin.command: python3 -m venv --help
      changed_when: false

    - name: Ensure OpenViking base directory exists
      ansible.builtin.file:
        path: "{{ openviking_dir }}"
        state: directory
        mode: "0750"
        owner: "{{ openviking_user }}"
        group: "{{ openviking_user }}"

    - name: Ensure OpenViking virtual environment exists
      ansible.builtin.command: python3 -m venv "{{ openviking_venv_dir }}"
      args:
        creates: "{{ openviking_venv_dir }}/bin/activate"

    - name: Install OpenViking package
      ansible.builtin.pip:
        name: "{{ openviking_pip_package }}"
        state: present
        virtualenv: "{{ openviking_venv_dir }}"

    - name: Validate required OpenViking embedding settings
      ansible.builtin.assert:
        that:
          - openviking_embedding_provider | length > 0
          - openviking_embedding_api_key | length > 0
          - openviking_embedding_model | length > 0
          - openviking_embedding_dimension | int > 0
        fail_msg: >-
          Set OpenViking embedding settings via vars (provider/api_key/model/dimension).

    - name: Validate required OpenViking VLM settings
      ansible.builtin.assert:
        that:
          - openviking_vlm_provider | length > 0
          - openviking_vlm_model | length > 0
          - openviking_vlm_provider == 'openai-codex' or (openviking_vlm_api_key | length > 0)
        fail_msg: >-
          Set OpenViking VLM settings via vars. For non-openai-codex providers,
          openviking_vlm_api_key is required.

    - name: Render OpenViking server config non-interactively
      ansible.builtin.template:
        src: templates/openviking.ov.conf.j2
        dest: "{{ openviking_dir }}/ov.conf"
        mode: "0600"
        owner: "{{ openviking_user }}"
        group: "{{ openviking_user }}"

    - name: Validate OpenViking config and provider connectivity
      ansible.builtin.command: "{{ openviking_venv_dir }}/bin/openviking-server doctor"
      environment:
        OPENVIKING_CONFIG_FILE: "{{ openviking_dir }}/ov.conf"
      register: openviking_doctor
      changed_when: false
      no_log: true

    - name: Install OpenViking systemd service unit
      ansible.builtin.template:
        src: templates/openviking.service.j2
        dest: "/etc/systemd/system/{{ openviking_service_name }}.service"
        mode: "0644"
      notify: Restart OpenViking service

    - name: Ensure OpenViking service is enabled and started
      ansible.builtin.systemd:
        name: "{{ openviking_service_name }}"
        daemon_reload: true
        enabled: true
        state: started

    - name: Confirm non-interactive OpenViking initialization
      ansible.builtin.debug:
        msg: >-
          OpenViking ov.conf was rendered from Ansible vars, validated via
          doctor, and configured as a systemd service.

  handlers:
    - name: Restart OpenViking service
      ansible.builtin.systemd:
        name: "{{ openviking_service_name }}"
        daemon_reload: true
        state: restarted
